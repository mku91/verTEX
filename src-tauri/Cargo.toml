[package]
name = "vertex"
version = "1.0.0"
description = "Low-poly 3D editor focused on vertices"
edition = "2024"

[dependencies]
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# (Windows' own TLS and no zip: the update is the installer itself - the smaller program.)
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["native-tls", "system-proxy"] }
tokio = { version = "1", features = ["sync"] }
trash = "5.2.9"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Small rather than fast: the program's own code is little, the size is the point.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
