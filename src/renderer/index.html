<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <title>verTEX</title>
  <link rel="stylesheet" href="../fonts/all.css">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "../../node_modules/three/build/three.module.js",
        "three/addons/": "../../node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <span class="logo">ver<b>TEX</b></span>
      <div id="modes" title="Режим выделения (Tab / Shift+Tab)">
        <span id="mode-slider"></span>
        <button data-mode="object">Объект</button>
        <button data-mode="face">Грань</button>
        <button data-mode="edge">Ребро</button>
        <button data-mode="vertex">Вершина</button>
      </div>
      <div id="top-actions">
        <button id="cut-toggle" data-action="toggle-cut" title="Разрез: разрез объекта по линии на грани (K)" aria-label="Разрез">
          <i class="fa-solid fa-scissors"></i>
        </button>
        <button id="extrude-toggle" data-action="toggle-extrude" title="Экструд: выдавить грани или рёбра (Ctrl+E)" aria-label="Экструд">
          <i class="fa-solid fa-arrow-up-from-bracket"></i>
        </button>
        <button id="polygon-toggle" data-action="toggle-polygon" title="Полигон: нарисовать плоский полигон по точкам сетки (G)" aria-label="Полигон">
          <i class="fa-solid fa-draw-polygon"></i>
        </button>
        <button id="pencil-toggle" data-action="toggle-pencil" title="Карандаш: рисовать вершины и рёбра, вытягивая их из вершин (P)" aria-label="Карандаш">
          <i class="fa-solid fa-pencil"></i>
        </button>
      </div>
      <div id="mirror-control">
        <button id="mirror-toggle" class="grid-toggle" title="Зеркало: правки повторяются по другую сторону плоскости">
          <i class="fa-solid fa-arrows-left-right-to-line"></i>
        </button>
        <div id="mirror-popup" class="grid-popup" hidden>
          <div class="grid-popup-title">Глобальное зеркало</div>
          <div class="plane-buttons mirror-axes" data-mirror="global">
            <button class="plane-button x" data-mirror-axis="x" title="Плоскость YZ (через начало координат)">X</button>
            <button class="plane-button y" data-mirror-axis="y" title="Плоскость XZ (через начало координат)">Y</button>
            <button class="plane-button z" data-mirror-axis="z" title="Плоскость XY (через начало координат)">Z</button>
          </div>
          <div class="mirror-note" data-mirror-note="global"></div>
          <div class="grid-popup-title">Локальное зеркало</div>
          <div class="plane-buttons mirror-axes" data-mirror="local">
            <button class="plane-button x" data-mirror-axis="x" title="Плоскость YZ через опорную точку объекта">X</button>
            <button class="plane-button y" data-mirror-axis="y" title="Плоскость XZ через опорную точку объекта">Y</button>
            <button class="plane-button z" data-mirror-axis="z" title="Плоскость XY через опорную точку объекта">Z</button>
          </div>
          <div class="mirror-note" data-mirror-note="local"></div>
        </div>
        </div>
      <button id="local-toggle" class="grid-toggle" data-action="toggle-local">
        <i class="fa-solid fa-globe"></i>
      </button>
      <div id="grid-controls">
        <button id="snap-toggle" class="grid-toggle" data-action="toggle-snapping">
          <i class="fa-solid fa-magnet"></i>
        </button>
        <div class="grid-control" data-grid="coarse">
          <button title="Крупная сетка: шаг привязки">
            <i class="fa-solid fa-table-cells-large"></i>
            <span class="grid-value"></span>
          </button>
          <div class="grid-popup" hidden>
            <div class="grid-popup-title">Крупная сетка</div>
            <input type="range" min="0" max="4" step="1">
            <output></output>
          </div>
        </div>
        <div class="grid-control" data-grid="fine">
          <button title="Мелкая сетка: на сколько частей делится клетка, пока зажат Ctrl">
            <i class="fa-solid fa-table-cells"></i>
            <span class="grid-value"></span>
          </button>
          <div class="grid-popup" hidden>
            <div class="grid-popup-title">Мелкая сетка (Ctrl)</div>
            <input type="range" min="2" max="10" step="1">
            <output></output>
          </div>
        </div>
      </div>
    </header>

    <aside id="toolbar">
      <button data-tool="select" title="Выделение (V)">
        <i class="fa-solid fa-arrow-pointer"></i>
      </button>
      <button data-tool="move" title="Перемещение (W)">
        <i class="fa-solid fa-up-down-left-right"></i>
      </button>
      <button data-tool="rotate" title="Вращение (R)">
        <i class="fa-solid fa-rotate"></i>
      </button>
      <button data-tool="scale" title="Масштаб (S)">
        <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
      </button>
      <button data-tool="pivot" title="Опорная точка (D)">
        <i class="fa-solid fa-crosshairs"></i>
      </button>
      <button id="place-toggle" data-action="toggle-place" title="Разместить: поставить объект на поверхность другого, прижав выбранной стороной" aria-label="Разместить">
        <i class="fa-solid fa-arrows-down-to-line"></i>
      </button>

      <hr>

      <button data-action="make-face" title="Создать грань через выделенные вершины или рёбра; из двух вершин — ребро (Ctrl+D)">
        <i class="fa-solid fa-square-plus"></i>
      </button>
      <button data-action="flip-faces" title="Инвертировать грань: поменять местами лицевую и обратную стороны выделенных граней или всех граней выбранных объектов (Ctrl+I)">
        <i class="fa-solid fa-clone"></i>
      </button>
      <button data-action="delete" title="Удалить выделенные вершины (Delete)">
        <i class="fa-solid fa-trash-can"></i>
      </button>
      <button data-action="frame" title="Показать выделение (F)">
        <i class="fa-solid fa-expand"></i>
      </button>

      <!-- At the bottom of the toolbar, next to the panel it opens. -->
      <button data-action="toggle-views" title="Три вида (B)">
        <i class="fa-solid fa-table-columns"></i>
      </button>
    </aside>

    <div id="workspace">
    <main id="viewport">
      <div id="operation-banner">
        <span id="operation-name"></span>
        <button id="operation-close" title="Выключить режим (Esc)">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="place-options" class="tool-options">
        <span>Сторона</span>
        <button data-place="-y" class="axis y" title="Низ объекта (по его оси Y)">−Y</button>
        <button data-place="+y" class="axis y" title="Верх объекта">+Y</button>
        <button data-place="-x" class="axis x" title="Сторона −X объекта">−X</button>
        <button data-place="+x" class="axis x" title="Сторона +X объекта">+X</button>
        <button data-place="-z" class="axis z" title="Сторона −Z объекта">−Z</button>
        <button data-place="+z" class="axis z" title="Сторона +Z объекта">+Z</button>
      </div>
      <div id="cut-options" class="tool-options">
        <button data-cut="vertical" title="Вертикальный разрез">
          <i class="fa-solid fa-grip-lines-vertical"></i><span>Вертикальный</span>
        </button>
        <button data-cut="horizontal" title="Горизонтальный разрез">
          <i class="fa-solid fa-grip-lines"></i><span>Горизонтальный</span>
        </button>
      </div>
      <div id="axis-gizmo" title="Фиксация перемещения вершины: 1 — свободно, 2 — X, 3 — Y, 4 — Z"></div>
      <button id="focus-button" data-action="toggle-focus" title="Фокус: тёмный фон, объект — белый каркас с точками вершин, выбор сквозь объект (T)">
        <i class="fa-solid fa-bullseye"></i>
      </button>
      <div id="shading">
        <button id="shading-button" title="Вид объекта">
          <i class="fa-solid fa-circle-half-stroke"></i>
        </button>
        <div id="shading-menu" hidden>
          <button data-shading="solid">Сплошной</button>
          <button data-shading="wireframe">Каркас</button>
          <button data-shading="orientation" title="Лицевая сторона грани — голубая, обратная — красная (N)">Ориентация граней</button>
          <button disabled title="Текстур и развёртки в программе пока нет">Текстуры <small>пока нет</small></button>
        </div>
      </div>
      <div id="float-panels">
      <div id="dimensions" hidden>
        <div class="properties-header">
          <p>Размер</p>
          <button id="copy-size" title="Скопировать размеры X, Y, Z одной строкой">
            <i class="fa-regular fa-copy"></i>
          </button>
          <button id="paste-size" title="Вставить размеры X, Y, Z из буфера обмена">
            <i class="fa-regular fa-paste"></i>
          </button>
        </div>
        <label><span class="axis x">X</span><input type="text" inputmode="decimal" spellcheck="false" data-size="x"></label>
        <label><span class="axis y">Y</span><input type="text" inputmode="decimal" spellcheck="false" data-size="y"></label>
        <label><span class="axis z">Z</span><input type="text" inputmode="decimal" spellcheck="false" data-size="z"></label>
      </div>
      <div id="properties" hidden>
        <div class="properties-header">
          <p id="selection-count"></p>
          <button id="center-pivot" hidden title="Поставить опорную точку в центр объекта">
            <i class="fa-solid fa-arrows-to-dot"></i>
          </button>
          <button id="copy-vector" title="Скопировать X, Y, Z одной строкой">
            <i class="fa-regular fa-copy"></i>
          </button>
          <button id="paste-vector" title="Вставить X, Y, Z из буфера обмена">
            <i class="fa-regular fa-paste"></i>
          </button>
        </div>
        <label><span class="axis x">X</span><input type="text" inputmode="decimal" spellcheck="false" data-axis="x"></label>
        <label><span class="axis y">Y</span><input type="text" inputmode="decimal" spellcheck="false" data-axis="y"></label>
        <label><span class="axis z">Z</span><input type="text" inputmode="decimal" spellcheck="false" data-axis="z"></label>
      </div>
      <div id="rotation" hidden>
        <div class="properties-header">
          <p>Вращение</p>
          <button id="copy-rotation" title="Скопировать углы X, Y, Z одной строкой">
            <i class="fa-regular fa-copy"></i>
          </button>
          <button id="paste-rotation" title="Вставить углы X, Y, Z из буфера обмена">
            <i class="fa-regular fa-paste"></i>
          </button>
        </div>
        <label><span class="axis x">X</span><input type="text" inputmode="decimal" spellcheck="false" data-rotation="x" title="Угол в градусах"></label>
        <label><span class="axis y">Y</span><input type="text" inputmode="decimal" spellcheck="false" data-rotation="y" title="Угол в градусах"></label>
        <label><span class="axis z">Z</span><input type="text" inputmode="decimal" spellcheck="false" data-rotation="z" title="Угол в градусах"></label>
      </div>
      </div>
      <div id="overlap-toast">
        <div class="toast-timer"><i></i></div>
        <p></p>
        <div class="toast-buttons">
          <button data-keep>Оставить</button>
          <button data-merge>Соединить</button>
        </div>
      </div>
      <div id="polygon-popup" hidden title="Плоскость полигона: клик по оси, которой она перпендикулярна"></div>
      <div id="extrude-popup" hidden title="Куда выдавить ребро: клик по оси, по центру — авто"></div>
    </main>
    <div id="views-splitter" hidden title="Потяните, чтобы изменить высоту панели; двойной клик — вернуть исходную"></div>
    <section id="ortho-views" hidden title="ЛКМ — тянуть вершину · Shift+перетаскивание — рамка выделения · ПКМ — панорама · Колесо — масштаб"></section>
    </div>

    <aside id="panel">
      <section id="outliner-section">
        <div class="outliner-header">
          <h2>Сцена</h2>
          <button id="add-object" title="Добавить объект"><i class="fa-solid fa-plus"></i></button>
        </div>
        <div id="add-menu" hidden>
          <button data-primitive="cube">Куб…</button>
          <button data-primitive="cone">Конус…</button>
          <button data-primitive="cylinder">Цилиндр…</button>
          <button data-primitive="sphere">Сфера…</button>
          <button data-group>Группа</button>
        </div>
        <form id="add-form" hidden>
          <h3></h3>
          <div class="fields"></div>
          <div class="form-buttons">
            <button type="button" data-cancel>Отмена</button>
            <button type="submit">Создать</button>
          </div>
        </form>
        <div id="outliner" title="Клик — выбрать объект · Shift+клик — добавить или убрать · двойной клик — переименовать · перетащить на объект — вложить в него, на пустое место — вынести наверх"></div>
      </section>
      <section id="stats">
        <h2 id="stats-title" title="Данные выделенных объектов; без выделения — всей сцены"></h2>
        <dl>
          <dt>Вершины</dt><dd id="stat-vertices"></dd>
          <dt>Рёбра</dt><dd id="stat-edges"></dd>
          <dt>Грани</dt><dd id="stat-faces"></dd>
          <dt title="Объём данных модели: координаты вершин и состав граней. Память, занятая редактором, больше.">Размер</dt><dd id="stat-size"></dd>
        </dl>
      </section>
    </aside>

    <footer id="statusbar">
      <button id="errors-button" class="issues-button" title="Ошибки в модели">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span></span>
      </button>
      <button id="warnings-button" class="issues-button" title="Предупреждения о модели">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span></span>
      </button>
    </footer>
  </div>

  <div id="warnings-list" hidden></div>

  <div id="settings-dialog" hidden>
    <div class="dialog settings">
      <div class="settings-head">
        <h2>Настройки</h2>
        <button id="settings-close" title="Закрыть (Esc)">Закрыть</button>
      </div>
      <div class="settings-body">
        <nav id="settings-nav">
          <div class="settings-group">Интерфейс</div>
          <button data-page="appearance" class="active">Оформление</button>
          <div class="settings-group">Редактор</div>
          <button data-page="controls">Управление</button>
          <button data-page="hotkeys">Хоткеи</button>
        </nav>
        <div class="settings-pages">
          <section data-page="appearance">
            <label>
              <span>Тема</span>
              <select id="theme"></select>
            </label>
          </section>
          <section data-page="controls" hidden>
            <label title="На сколько меняется расстояние до объекта за один щелчок колеса">
              <span>Сила зума колесом</span>
              <input type="range" id="zoom-strength" min="3" max="30" step="1">
              <output id="zoom-strength-value"></output>
            </label>
            <label title="Как долго камера доезжает после поворота колеса; 0 — мгновенно">
              <span>Плавность зума</span>
              <input type="range" id="zoom-smoothness" min="0" max="10" step="1">
              <output id="zoom-smoothness-value"></output>
            </label>
          </section>
          <section data-page="hotkeys" hidden>
            <div class="hotkeys-head">
              <span id="hotkey-note"></span>
              <button id="hotkeys-reset" title="Вернуть все клавиши по умолчанию">Сбросить все</button>
            </div>
            <div id="hotkey-list"></div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
