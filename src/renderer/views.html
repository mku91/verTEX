<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:">
  <title data-i18n="window.views.title">verTEX</title>
  <link rel="stylesheet" href="../fonts/all.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* The window of views (see views-window.js): four of them, two by two -
       the perspective one, then the three of the bottom panel's. */
    #quad {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 1px;
      background: var(--border);
    }

    #quad .persp-view {
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }

    #quad .persp-view canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #quad .persp-view .ortho-header {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div id="quad">
    <div class="persp-view" data-i18n-title="views.perspective.title">
      <canvas></canvas>
      <div class="ortho-header"><span data-i18n="views.perspective"></span></div>
    </div>
  </div>
</body>
</html>
