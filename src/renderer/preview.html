<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:">
  <title>verTEX</title>
  <style>
    /* The preview's window (see preview-window.js): the model, and nothing else. */
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #preview {
      position: fixed;
      inset: 0;
    }

    canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="preview"><canvas data-i18n-title="preview.canvas"></canvas></div>
</body>
</html>
