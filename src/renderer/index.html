<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:">
  <title>verTEX</title>
  <link rel="stylesheet" href="../fonts/all.css">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "../../node_modules/three/build/three.module.js",
        "three/addons/": "../../node_modules/three/examples/jsm/",
        "@dimforge/rapier3d-compat": "../../node_modules/@dimforge/rapier3d-compat/dist/rapier.mjs"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <span class="logo">ver<b>TEX</b></span>
      <div id="modes" data-i18n-title="html.modes.title">
        <span id="mode-slider"></span>
        <button data-mode="object" data-i18n="html.modes.mode-object.text"></button>
        <button data-mode="face" data-i18n="html.modes.mode-face.text"></button>
        <button data-mode="edge" data-i18n="html.modes.mode-edge.text"></button>
        <button data-mode="vertex" data-i18n="html.modes.mode-vertex.text"></button>
      </div>
      <div id="history-actions" class="top-actions">
        <button id="undo-button" data-action="undo" data-i18n-title="html.undo-button.title" data-i18n-aria-label="html.undo-button.aria-label">
          <i class="fa-solid fa-arrow-rotate-left"></i>
        </button>
        <button id="redo-button" data-action="redo" data-i18n-title="html.redo-button.title" data-i18n-aria-label="html.redo-button.aria-label">
          <i class="fa-solid fa-arrow-rotate-right"></i>
        </button>
      </div>
      <div id="top-actions" class="top-actions">
        <button id="cut-toggle" data-action="toggle-cut" data-i18n-title="html.cut-toggle.title" data-i18n-aria-label="html.cut-toggle.aria-label">
          <i class="fa-solid fa-scissors"></i>
        </button>
        <button id="extrude-toggle" data-action="toggle-extrude" data-i18n-title="html.extrude-toggle.title" data-i18n-aria-label="html.extrude-toggle.aria-label">
          <i class="fa-solid fa-arrow-up-from-bracket"></i>
        </button>
        <button id="polygon-toggle" data-action="toggle-polygon" data-i18n-title="html.polygon-toggle.title" data-i18n-aria-label="html.polygon-toggle.aria-label">
          <i class="fa-solid fa-draw-polygon"></i>
        </button>
        <button id="pencil-toggle" data-action="toggle-pencil" data-i18n-title="html.pencil-toggle.title" data-i18n-aria-label="html.pencil-toggle.aria-label">
          <i class="fa-solid fa-pencil"></i>
        </button>
        <button id="place-toggle" data-action="toggle-place" data-i18n-title="html.place-toggle.title" data-i18n-aria-label="html.place-toggle.aria-label">
          <i class="fa-solid fa-arrows-down-to-line"></i>
        </button>
      </div>
      <div id="mirror-control">
        <button id="mirror-toggle" class="grid-toggle" data-i18n-title="html.mirror-toggle.title">
          <i class="fa-solid fa-arrows-left-right-to-line"></i>
        </button>
        <div id="mirror-popup" class="grid-popup" hidden>
          <div class="grid-popup-title" data-i18n="html.mirror-popup.grid-popup-title.text"></div>
          <div class="plane-buttons mirror-axes" data-mirror="global">
            <button class="plane-button x" data-mirror-axis="x" data-i18n-title="html.mirror-popup.plane-buttons.mirror-axis-x.title">X</button>
            <button class="plane-button y" data-mirror-axis="y" data-i18n-title="html.mirror-popup.plane-buttons.mirror-axis-y.title">Y</button>
            <button class="plane-button z" data-mirror-axis="z" data-i18n-title="html.mirror-popup.plane-buttons.mirror-axis-z.title">Z</button>
          </div>
          <div class="mirror-note" data-mirror-note="global"></div>
          <div class="grid-popup-title" data-i18n="html.mirror-popup.grid-popup-title.text2"></div>
          <div class="plane-buttons mirror-axes" data-mirror="local">
            <button class="plane-button x" data-mirror-axis="x" data-i18n-title="html.mirror-popup.plane-buttons.mirror-axis-x.title2">X</button>
            <button class="plane-button y" data-mirror-axis="y" data-i18n-title="html.mirror-popup.plane-buttons.mirror-axis-y.title2">Y</button>
            <button class="plane-button z" data-mirror-axis="z" data-i18n-title="html.mirror-popup.plane-buttons.mirror-axis-z.title2">Z</button>
          </div>
          <div class="mirror-note" data-mirror-note="local"></div>
        </div>
        </div>
      <button id="local-toggle" class="grid-toggle" data-action="toggle-local">
        <i class="fa-solid fa-globe"></i>
      </button>
      <div id="grid-controls">
        <button id="snap-toggle" class="grid-toggle" data-action="toggle-snapping">
          <i class="fa-solid fa-magnet"></i>
        </button>
        <div class="grid-control" data-grid="coarse">
          <button data-i18n-title="html.grid-controls.grid-coarse.button.title">
            <i class="fa-solid fa-table-cells-large"></i>
            <span class="grid-value"></span>
          </button>
          <div class="grid-popup" hidden>
            <div class="grid-popup-title" data-i18n="html.grid-controls.grid-coarse.grid-popup.grid-popup-title.text"></div>
            <input type="range" min="0" max="4" step="1">
            <output></output>
          </div>
        </div>
        <div class="grid-control" data-grid="fine">
          <button data-i18n-title="html.grid-controls.grid-fine.button.title">
            <i class="fa-solid fa-table-cells"></i>
            <span class="grid-value"></span>
          </button>
          <div class="grid-popup" hidden>
            <div class="grid-popup-title" data-i18n="html.grid-controls.grid-fine.grid-popup.grid-popup-title.text"></div>
            <input type="range" min="2" max="10" step="1">
            <output></output>
          </div>
        </div>
      </div>
      <span class="top-separator"></span>
      <div id="screen-modes" class="top-actions">
        <button id="collision-button" data-i18n-title="html.collision-button.title">
          <i class="fa-solid fa-shapes"></i><span data-i18n="html.collision-button.span.text"></span>
        </button>
        <button id="animation-button" data-action="toggle-animation" data-i18n-title="html.animation-button.title">
          <i class="fa-solid fa-film"></i><span data-i18n="html.animation-button.span.text"></span>
        </button>
        <button id="render-button" data-action="render-sprites" data-i18n-title="html.render-button.title">
          <i class="fa-solid fa-camera"></i><span data-i18n="html.render-button.span.text"></span>
        </button>
      </div>
    </header>

    <aside id="toolbar">
      <button data-tool="select" data-i18n-title="html.toolbar.tool-select.title">
        <i class="fa-solid fa-arrow-pointer"></i>
      </button>
      <button data-tool="move" data-i18n-title="html.toolbar.tool-move.title">
        <i class="fa-solid fa-up-down-left-right"></i>
      </button>
      <button data-tool="rotate" data-i18n-title="html.toolbar.tool-rotate.title">
        <i class="fa-solid fa-rotate"></i>
      </button>
      <button data-tool="scale" data-i18n-title="html.toolbar.tool-scale.title">
        <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
      </button>
      <button data-tool="pivot" data-i18n-title="html.toolbar.tool-pivot.title">
        <i class="fa-solid fa-crosshairs"></i>
      </button>

      <hr>

      <button data-tool="paint" data-i18n-title="html.toolbar.tool-paint.title">
        <i class="fa-solid fa-paintbrush"></i>
      </button>
      <button id="paint-color" data-i18n-title="html.paint-color.title"><span></span></button>
      <button data-tool="pipette" data-i18n-title="html.toolbar.tool-pipette.title">
        <i class="fa-solid fa-eye-dropper"></i>
      </button>
      <button data-tool="fill" data-i18n-title="html.toolbar.tool-fill.title">
        <i class="fa-solid fa-fill-drip"></i>
      </button>
      <div id="shape-tools" class="tool-group">
        <button id="shape-tool" data-i18n-title="html.shape-tool.title">
          <i class="fa-regular fa-square"></i>
        </button>
        <div class="tool-flyout" hidden>
          <button data-shape="rect" data-filled="0" data-i18n-title="html.shape-tools.tool-flyout.shape-rect.filled-0.title"><i class="fa-regular fa-square"></i></button>
          <button data-shape="rect" data-filled="1" data-i18n-title="html.shape-tools.tool-flyout.shape-rect.filled-1.title"><i class="fa-solid fa-square"></i></button>
          <button data-shape="ellipse" data-filled="0" data-i18n-title="html.shape-tools.tool-flyout.shape-ellipse.filled-0.title"><i class="fa-regular fa-circle"></i></button>
          <button data-shape="ellipse" data-filled="1" data-i18n-title="html.shape-tools.tool-flyout.shape-ellipse.filled-1.title"><i class="fa-solid fa-circle"></i></button>
        </div>
      </div>
      <button data-tool="marquee" data-i18n-title="html.toolbar.tool-marquee.title">
        <i class="fa-solid fa-border-none"></i>
      </button>

      <hr>

      <button data-action="make-face" data-i18n-title="html.toolbar.action-make-face.title">
        <i class="fa-solid fa-square-plus"></i>
      </button>
      <button data-action="flip-faces" data-i18n-title="html.toolbar.action-flip-faces.title">
        <i class="fa-solid fa-clone"></i>
      </button>
      <button data-action="delete" data-i18n-title="html.toolbar.action-delete.title">
        <i class="fa-solid fa-trash-can"></i>
      </button>
      <button data-action="frame" data-i18n-title="html.toolbar.action-frame.title">
        <i class="fa-solid fa-expand"></i>
      </button>

      <!-- At the bottom of the toolbar, next to the panel it opens. -->
      <button data-action="views-window" data-i18n-title="html.toolbar.action-views-window.title">
        <i class="fa-solid fa-up-right-from-square"></i>
      </button>
      <button data-action="toggle-views" data-i18n-title="html.toolbar.action-toggle-views.title">
        <i class="fa-solid fa-table-columns"></i>
      </button>
      <button data-action="toggle-uv" data-i18n-title="html.toolbar.action-toggle-uv.title">
        <i class="fa-solid fa-object-group"></i>
      </button>
    </aside>

    <div id="workspace">
    <main id="viewport">
      <div id="mode-indicator" data-i18n-title="html.mode-indicator.title"></div>
      <div id="sim-controls">
        <button id="sim-start"><i class="fa-solid fa-play"></i><span data-i18n="html.sim-start.span.text"></span></button>
        <button id="sim-restart" data-i18n-title="html.sim-restart.title"><i class="fa-solid fa-rotate-left"></i></button>
      </div>
      <div id="operation-banner">
        <span id="operation-name"></span>
        <button id="operation-close" data-i18n-title="html.operation-close.title">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="place-options" class="tool-options">
        <span data-i18n="html.place-options.span.text"></span>
        <button data-place="-y" class="axis y" data-i18n-title="html.place-options.place-y.title">−Y</button>
        <button data-place="+y" class="axis y" data-i18n-title="html.place-options.place-y.title2">+Y</button>
        <button data-place="-x" class="axis x" data-i18n-title="html.place-options.place-x.title">−X</button>
        <button data-place="+x" class="axis x" data-i18n-title="html.place-options.place-x.title2">+X</button>
        <button data-place="-z" class="axis z" data-i18n-title="html.place-options.place-z.title">−Z</button>
        <button data-place="+z" class="axis z" data-i18n-title="html.place-options.place-z.title2">+Z</button>
      </div>
      <div id="cut-options" class="tool-options">
        <button data-cut="vertical" data-i18n-title="html.cut-options.button.title">
          <i class="fa-solid fa-grip-lines-vertical"></i><span data-i18n="html.cut-options.button.span.text"></span>
        </button>
        <button data-cut="horizontal" data-i18n-title="html.cut-options.button.title2">
          <i class="fa-solid fa-grip-lines"></i><span data-i18n="html.cut-options.button.span.text2"></span>
        </button>
      </div>
      <div id="axis-gizmo" data-i18n-title="html.axis-gizmo.title"></div>
      <button id="light-button" data-action="toggle-light" data-i18n-title="html.light-button.title">
        <i class="fa-solid fa-sun"></i>
      </button>
      <button id="preview-button" data-action="toggle-preview" data-i18n-title="html.preview-button.title">
        <i class="fa-solid fa-eye"></i>
      </button>
      <button id="focus-button" data-action="toggle-focus" data-i18n-title="html.focus-button.title">
        <i class="fa-solid fa-bullseye"></i>
      </button>
      <div id="shading">
        <button id="shading-button" data-i18n-title="html.shading-button.title">
          <i class="fa-solid fa-circle-half-stroke"></i>
        </button>
        <div id="shading-menu" hidden>
          <button data-shading="solid" data-i18n="html.shading-menu.shading-solid.text"></button>
          <button data-shading="wireframe" data-i18n="html.shading-menu.shading-wireframe.text"></button>
          <button data-shading="orientation" data-i18n-title="html.shading-menu.shading-orientation.title" data-i18n="html.shading-menu.shading-orientation.text"></button>
          <button data-shading="textured" data-i18n-title="html.shading-menu.shading-textured.title" data-i18n="html.shading-menu.shading-textured.text"></button>
          <button data-shading="weights" data-i18n-title="html.shading-menu.shading-weights.title" data-i18n="html.shading-menu.shading-weights.text"></button>
        </div>
      </div>
      <div id="overlap-toast">
        <div class="toast-timer"><i></i></div>
        <p></p>
        <div class="toast-buttons">
          <button data-keep data-i18n="html.overlap-toast.toast-buttons.button.text"></button>
          <button data-merge data-i18n="html.overlap-toast.toast-buttons.button.text2"></button>
        </div>
      </div>
      <div id="polygon-popup" hidden data-i18n-title="html.polygon-popup.title"></div>
      <div id="extrude-popup" hidden data-i18n-title="html.extrude-popup.title"></div>
    </main>
    <div id="views-splitter" hidden data-i18n-title="html.views-splitter.title"></div>
    <section id="ortho-views" hidden data-i18n-title="html.ortho-views.title"></section>
    <div id="anim-splitter" hidden data-i18n-title="html.anim-splitter.title"></div>
    <section id="timeline" hidden>
      <div class="uv-bar tl-bar">
        <b data-i18n="html.timeline.uv-bar.b.text"></b>
        <select class="clip-select" data-i18n-title="html.timeline.uv-bar.clip-select.title"></select>
        <button data-tl="add" data-i18n-title="html.timeline.uv-bar.tl-add.title"><i class="fa-solid fa-plus"></i></button>
        <button data-tl="edit" data-i18n-title="html.timeline.uv-bar.tl-edit.title"><i class="fa-solid fa-pen"></i></button>
        <button data-tl="duplicate" data-i18n-title="html.timeline.uv-bar.tl-duplicate.title"><i class="fa-regular fa-clone"></i></button>
        <button data-tl="delete" data-i18n-title="html.timeline.uv-bar.tl-delete.title"><i class="fa-solid fa-trash-can"></i></button>
        <i class="uv-divider"></i>
        <button data-tl="first" data-i18n-title="html.timeline.uv-bar.tl-first.title"><i class="fa-solid fa-backward-step"></i></button>
        <button data-tl="prev" data-i18n-title="html.timeline.uv-bar.tl-prev.title"><i class="fa-solid fa-caret-left"></i></button>
        <button data-tl="play" data-i18n-title="html.timeline.uv-bar.tl-play.title"><i class="fa-solid fa-play"></i></button>
        <button data-tl="next" data-i18n-title="html.timeline.uv-bar.tl-next.title"><i class="fa-solid fa-caret-right"></i></button>
        <button data-tl="last" data-i18n-title="html.timeline.uv-bar.tl-last.title"><i class="fa-solid fa-forward-step"></i></button>
        <button class="tl-loop" data-i18n-title="html.timeline.uv-bar.tl-loop.title"><i class="fa-solid fa-repeat"></i></button>
        <span class="tl-frame"></span>
        <i class="uv-divider"></i>
        <label class="tl-field tl-number" data-i18n-title="html.timeline.uv-bar.tl-field.title">FPS<input type="text" name="clip-fps" inputmode="numeric" spellcheck="false"></label>
        <label class="tl-field tl-number" data-i18n-title="html.timeline.uv-bar.tl-field.title2"><i18n-text data-i18n="html.timeline.uv-bar.tl-field.text"></i18n-text><input type="text" name="clip-length" inputmode="numeric" spellcheck="false"></label>
        <i class="uv-divider"></i>
        <button data-tl="key" data-i18n-title="html.timeline.uv-bar.tl-key.title"><i class="fa-solid fa-key"></i></button>
        <button data-tl="autokey" class="tl-autokey" data-i18n-title="html.timeline.uv-bar.tl-autokey.title"><span class="rec-dot"></span></button>
        <i class="uv-divider"></i>
        <button class="tl-restore" disabled><i class="fa-solid fa-rotate-left"></i></button>
      </div>
      <p class="tl-empty" hidden data-i18n="html.timeline.tl-empty.text"></p>
      <div class="tl-body">
        <div class="tl-corner">
          <button class="tl-nodes-only" data-tl="nodesonly" data-i18n-title="html.timeline.tl-body.tl-corner.tl-nodesonly.title"><i class="fa-solid fa-circle-nodes"></i></button>
          <button class="tl-add tl-add-all" data-tl="keyall" data-i18n-title="html.timeline.tl-body.tl-corner.tl-keyall.title">+</button>
        </div>
        <canvas class="tl-ruler" data-i18n-title="html.timeline.tl-body.tl-ruler.title"></canvas>
        <div class="tl-scroll">
          <div class="tl-names"></div>
          <div class="tl-lanes-box"><canvas class="tl-lanes"></canvas></div>
        </div>
        <div class="tl-corner tl-corner-bottom"></div>
        <canvas class="tl-seconds" data-i18n-title="html.timeline.tl-body.tl-seconds.title"></canvas>
        <div class="tl-resize" data-i18n-title="html.timeline.tl-body.tl-resize.title"></div>
      </div>
    </section>
    <section id="uv-editor" hidden>
      <div class="uv-bar">
        <b>UV</b>
        <button id="uv-atlas-new" data-i18n-title="html.uv-atlas-new.title" hidden><i class="fa-solid fa-file-circle-plus"></i></button>
        <select id="uv-atlas" data-i18n-title="html.uv-atlas.title" hidden></select>
        <button data-uv="add" class="worded" data-i18n-title="html.uv-editor.uv-bar.uv-add.title">
          <i class="fa-solid fa-plus"></i><span data-i18n="html.uv-editor.uv-bar.uv-add.span.text"></span>
        </button>
        <button data-uv="remove" data-i18n-title="html.uv-editor.uv-bar.uv-remove.title">
          <i class="fa-solid fa-minus"></i>
        </button>
        <i class="uv-divider"></i>
        <button data-uv="turn-left" data-i18n-title="html.uv-editor.uv-bar.uv-turn-left.title">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
        <button data-uv="turn-right" data-i18n-title="html.uv-editor.uv-bar.uv-turn-right.title">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
        <button data-uv="flip-h" data-i18n-title="html.uv-editor.uv-bar.uv-flip-h.title">
          <i class="fa-solid fa-left-right"></i>
        </button>
        <button data-uv="flip-v" data-i18n-title="html.uv-editor.uv-bar.uv-flip-v.title">
          <i class="fa-solid fa-up-down"></i>
        </button>
        <i class="uv-divider"></i>
        <!-- The same, of the faces' places only: the picture stays, the faces show it mirrored or turned. -->
        <button data-uv="map-turn-left" class="uv-only" data-i18n-title="html.uv-editor.uv-bar.uv-map-turn-left.title">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
        <button data-uv="map-turn-right" class="uv-only" data-i18n-title="html.uv-editor.uv-bar.uv-map-turn-right.title">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
        <button data-uv="map-flip-h" class="uv-only" data-i18n-title="html.uv-editor.uv-bar.uv-map-flip-h.title">
          <i class="fa-solid fa-left-right"></i>
        </button>
        <button data-uv="map-flip-v" class="uv-only" data-i18n-title="html.uv-editor.uv-bar.uv-map-flip-v.title">
          <i class="fa-solid fa-up-down"></i>
        </button>
        <button data-uv="shape" data-i18n-title="html.uv-editor.uv-bar.uv-shape.title">
          <i class="fa-solid fa-lock"></i>
        </button>
        <button data-uv="regenerate" data-i18n-title="html.uv-editor.uv-bar.uv-regenerate.title">
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>
        <button data-uv="clean" data-i18n-title="html.uv-editor.uv-bar.uv-clean.title">
          <!-- (a broom of its own: the icon font's looks like a brush) -->
          <svg class="icon-broom" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M14.4 1.6 8.4 7.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M6.5 6.3 9.7 9.5 8.5 10.7 5.3 7.5Z" fill="currentColor"/>
            <path d="M6.9 9.1 1.4 10.2M6.9 9.1 2.3 12.3M6.9 9.1 3.7 13.7M6.9 9.1 5.8 14.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <button data-uv="pack" data-i18n-title="html.uv-editor.uv-bar.uv-pack.title">
          <i class="fa-solid fa-boxes-packing"></i>
        </button>
        <button data-uv="fit" data-i18n-title="html.uv-editor.uv-bar.uv-fit.title">
          <i class="fa-solid fa-expand"></i>
        </button>
        <i class="uv-divider"></i>
        <button data-uv="paste" data-i18n-title="html.uv-editor.uv-bar.uv-paste.title">
          <i class="fa-solid fa-paste"></i>
        </button>
        <i class="uv-divider"></i>
        <button data-uv="retro" data-i18n-title="html.uv-editor.uv-bar.uv-retro.title">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
        </button>
        <span class="uv-status"></span>
      </div>
      <canvas data-i18n-title="html.uv-editor.canvas.title"></canvas>
